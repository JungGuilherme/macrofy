name: Sync Calendar Events

on:
  schedule:
    # 09:00 UTC = 06:00 Brasília — once daily is plenty for earnings/dividend dates
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Login as admin
        id: login
        run: |
          RESP=$(curl -s -X POST \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}" \
            "${SUPABASE_URL}/auth/v1/token?grant_type=password")
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [[ -z "$TOKEN" ]]; then
            echo "::error::Admin login failed"
            echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error_description') or d.get('msg') or 'unknown error')"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Call sync Edge Functions
        run: |
          FAILED=0
          for fn in sync-earnings-br sync-earnings-us sync-dividends-br; do
            echo "▶ Calling $fn …"
            HTTP_STATUS=$(curl -s -o /tmp/resp_${fn}.json -w "%{http_code}" \
              -X POST \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${{ steps.login.outputs.token }}" \
              -H "Content-Type: application/json" \
              "${SUPABASE_URL}/functions/v1/${fn}")
            echo "   Status: $HTTP_STATUS"
            head -c 500 /tmp/resp_${fn}.json
            echo ""
            if [[ "$HTTP_STATUS" != "200" ]]; then
              echo "::error::$fn returned HTTP $HTTP_STATUS"
              FAILED=1
            fi
            sleep 5
          done
          exit $FAILED
